<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<link href="/css/base.css" rel="stylesheet" />
		<script src="/src/page/captured.js"></script>
	</head>
	<body class="bg-moon">
		<div class="d-flex flex-column w-100 font-size-16">
			<div class="bg-black text-white p-1 d-flex align-items-center justify-content-between">
				<div class="d-flex align-items-center">
					<img src="/images/m128.png" class="logo rounded mr-1" />
					<div class="d-flex align-items-center">
						<img src="/images/heart.png" alt="" class="w-21px" />
						<span class="ml-05">That's a nice shot!</span>
					</div>
				</div>
				<div class="">
					<input
						class="w-30em rounded bg-transparent text-white p-05"
						type="text"
						name="screenshotNameInput"
						value="Screenshot"
						id="screenshotNameInput"
					/>
				</div>
				<div class="d-flex align-items-center">
					<button class="text-white bg-transparent rounded p-05 ml-2" id="discardButton">
						Cancel
					</button>
					<button class="btn-primary rounded p-05 ml-2" id="uploadButton">
						Save to Moqups
					</button>
					<button class="btn-primary rounded p-05 ml-1 hidden" id="goToMoqupsButton">
						Done! Go to Moqups
					</button>
					<button
						class="text-white bg-transparent rounded p-05 ml-2 hidden"
						id="errorButton"
					>
						Oops! You&rsquo;ve hit your Moqups storage quota.
					</button>
				</div>
			</div>

						<div class="preloader__spinner__message p-1" id="loaderMessage">
							Loading...
						</div>
					</div>
					<img
						src="#"
						id="screenshotTaken"
						alt="Taken screenshot"
						class="img-responsive mq-pixelated bordered hidden"
					/>
				</div>
			</div>
		</div>
		<!-- The Modal -->
		<div id="pickTeamModal" aria-labelledby="dialog1_label" aria-modal="true" class="modal">
			<!-- Modal content -->
			<div class="modal-content">
				<span class="close">&times;</span>
				<p><b>Where would you like to save this image?</b></p>

				<div id="modalOptions"></div>
			</div>
		</div>

</html>
